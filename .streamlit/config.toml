[server]
headless = true
address = "localhost"          # only this computer can open the app
port = 8501
maxUploadSize = 200
enableStaticServing = true     # serves reconciliation_app/static (the font)

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"         # menu (top right) without developer options; Settings holds the Light / Dark / System choice

[theme]
primaryColor = "#123239"        # IremboPay dark teal (buttons, progress bars, selections)
font = "Nunito, sans-serif"     # rounded, close to the iremboPay logo lettering
baseFontSize = 14               # 23/10/2026: the whole app smaller (as at 85 % zoom) - text, spacing, buttons

# the two palettes the user can choose from (menu top right > Settings > App theme; "System" follows the computer)
[theme.light]
primaryColor = "#123239"            # IremboPay dark teal
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F7"
textColor = "#1D2B2F"

[theme.dark]
primaryColor = "#2B8A99"            # lighter IremboPay teal: still visible on the dark background
backgroundColor = "#0E1A1D"         # very dark teal
secondaryBackgroundColor = "#15282D"
textColor = "#E6EEF0"

[[theme.fontFaces]]
family = "Nunito"
url = "app/static/Nunito.ttf"   # reconciliation_app/static (no internet needed)
weight = "200 1000"

[runner]
magicEnabled = false          # never print values of bare expressions on the page
